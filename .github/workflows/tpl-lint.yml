name: Lint

on:
  push:
    branches-ignore:
      - main

jobs:
  lint:
    name: NextJS Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the source code
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Lint Check
        run: npm run lint