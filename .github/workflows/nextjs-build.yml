name: Next.js Build

on:
  workflow_call:

jobs:
  build:
    name: Next.js Lint and Build
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

    steps:
      - name: Checkout the source code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint Check
        run: bun run lint

      - name: Build Nextjs
        run: bun run build
