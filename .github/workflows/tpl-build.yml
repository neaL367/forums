on:
  push:
    branches: [ dev ]

jobs:
  lint:
    name: NextJS Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'bun'
          cache-dependency-path: ./bun.lock

      - name: Install dependencies
        run: bun install
      - name: Lint Check
        run: bun run lint

  build:
    name: NextJS Build
    needs: [lint]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the source code
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'bun'
          cache-dependency-path: ./bun.lock
      - name: Install dependencies
        run: bun install
      
      - name: Build
        run: bun run build